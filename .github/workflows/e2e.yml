name: E2E

on:
  - push
  - pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Extension E2E on Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Dependencies
        run: yarn --immutable

      # Playwright's own docs advise against caching browsers — restoring costs
      # about as much as downloading, and the system dependencies cannot be
      # cached — but the browser is the bulk of the install, so it is cached
      # against the lockfile that pins the Playwright version.
      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: yarn playwright install chromium --with-deps

      - name: Build
        run: yarn build

      - name: Run Extension E2E
        run: yarn test:e2e
